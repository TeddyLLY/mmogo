###################################################################
# Logback 设置
logging:
  level:
    root: INFO
    com.smart.mmogo: DEBUG
    org.springframework.data.mongodb.core: DEBUG
  file:
    name: logback.log # log name
  pattern:
    file: mmogo %d{yyyy-MM-dd HH:mm:ss.SSS} %p %C.%M %m %n
  logback:
    rollingpolicy:
      file-name-pattern: logback.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 10MB
      total-size-cap: 1GB
      max-history: 20

###################################################################
# 设置服务器端口
server:
  port: 8085
  servlet:
    contextPath=/:


spring:
###################################################################
# thymeleaf 配置
  thymeleaf:
    cache: false # 禁用缓存，修改完实时展示数据
    prefix: classpath:/templates/ # 文件所在位置
    suffix: .html # 后缀
  web:
    resources:
      static-locations: classpath:/static/ # 静态资源


###################################################################
# 配置数据库连接
# MongoDB
  data:
    mongodb:
      database: demo
      authentication-database: admin

